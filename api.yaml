openapi: 3.0.3
info:
  title: HabitQuest - API REST de hábitos gamificados
  version: 1.0.0
  description: Endpoints planeados para la API de HabitQuest
servers:
- url: http://localhost:8000
  description: Servidor local de desarrollo (cuando se implemente)
tags:
- name: Autenticación
  description: Registro y acceso
- name: Usuarios
  description: Perfil y estadísticas
- name: Hábitos
  description: Hábitos personales
- name: Grupos
  description: Creación y participación en grupos
- name: Retos
  description: Misiones individuales y grupales
- name: Cumplimientos
  description: Registro de actividades realizadas
- name: Gamificación
  description: Clasificaciones y progreso
paths:
  /auth/registro:
    post:
      tags:
      - Autenticación
      summary: Registrar un usuario
      requestBody:
        required: true
        description: Datos de la solicitud
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistroUsuario'
      responses:
        '201':
          description: Usuario creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '409':
          description: 'Conflicto: registro duplicado o estado incompatible'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422': &id001
          description: Datos de entrada inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/login:
    post:
      tags:
      - Autenticación
      summary: Iniciar sesión y obtener token
      requestBody:
        required: true
        description: Datos de la solicitud
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
      responses:
        '200':
          description: Token de acceso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
        '401':
          description: Credenciales incorrectas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422': *id001
  /usuarios/me:
    get:
      tags:
      - Usuarios
      summary: Consultar mi perfil
      responses:
        '200':
          description: Datos del usuario autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '401': &id002
          description: Token inexistente, inválido o vencido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - bearerAuth: []
  /usuarios/me/estadisticas:
    get:
      tags:
      - Usuarios
      summary: Consultar XP, nivel, racha e insignias
      responses:
        '200':
          description: Estadísticas personales
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Estadisticas'
        '401': *id002
      security:
      - bearerAuth: []
  /habitos:
    post:
      tags:
      - Hábitos
      summary: Crear hábito personal
      requestBody:
        required: true
        description: Datos de la solicitud
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HabitoCrear'
      responses:
        '201':
          description: Hábito creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Habito'
        '401': *id002
        '422': *id001
      security:
      - bearerAuth: []
    get:
      tags:
      - Hábitos
      summary: Listar mis hábitos
      responses:
        '200':
          description: Listado de hábitos propios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Habito'
        '401': *id002
      security:
      - bearerAuth: []
  /habitos/{habitoId}:
    delete:
      tags:
      - Hábitos
      summary: Eliminar uno de mis hábitos
      parameters:
      - name: habitoId
        in: path
        description: ''
        required: true
        schema:
          type: integer
          minimum: 1
      responses:
        '204':
          description: Hábito eliminado, sin contenido
        '401': *id002
        '403':
          description: No tiene permisos para esta operación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Recurso no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - bearerAuth: []
  /grupos:
    post:
      tags:
      - Grupos
      summary: Crear un grupo de hábitos
      requestBody:
        required: true
        description: Datos de la solicitud
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrupoCrear'
      responses:
        '201':
          description: Grupo creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Grupo'
        '401': &id007
          description: Token inexistente, inválido o vencido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Datos de entrada inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - bearerAuth: []
    get:
      tags:
      - Grupos
      summary: Consultar grupos públicos y mis grupos
      parameters:
      - name: solo_mios
        in: query
        description: Filtrar a mis grupos
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: Listado de grupos visibles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Grupo'
        '401': *id007
      security:
      - bearerAuth: []
  /grupos/{grupoId}/unirse:
    post:
      tags:
      - Grupos
      summary: Unirse a un grupo
      description: Para grupos privados se requiere código de invitación. La API no expone datos privados
        a usuarios ajenos.
      parameters:
      - name: grupoId
        in: path
        description: ''
        required: true
        schema:
          type: integer
          minimum: 1
      requestBody:
        required: true
        description: Código de invitación opcional para grupos públicos
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnirseGrupo'
      responses:
        '200':
          description: Unión confirmada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mensaje'
        '401': *id007
        '403': &id008
          description: No tiene permisos para esta operación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404': &id009
          description: Recurso no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 'Conflicto: registro duplicado o estado incompatible'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - bearerAuth: []
  /grupos/{grupoId}/miembros:
    get:
      tags:
      - Grupos
      summary: Consultar miembros de un grupo
      parameters:
      - name: grupoId
        in: path
        description: ''
        required: true
        schema:
          type: integer
          minimum: 1
      responses:
        '200':
          description: Lista de miembros
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Usuario'
        '401': *id007
        '403': *id008
        '404': *id009
      security:
      - bearerAuth: []
  /grupos/{grupoId}/ranking:
    get:
      tags:
      - Gamificación
      summary: Consultar ranking del grupo
      description: Ranking por puntos acumulados en el período solicitado. Solo se muestra a integrantes
        autorizados.
      parameters:
      - name: grupoId
        in: path
        description: ''
        required: true
        schema:
          type: integer
          minimum: 1
      - name: periodo
        in: query
        required: false
        schema:
          type: string
          enum:
          - semanal
          - mensual
          - general
          default: semanal
      responses:
        '200':
          description: Clasificación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ranking'
        '401': *id007
        '403': *id008
        '404': *id009
      security:
      - bearerAuth: []
  /retos:
    post:
      tags:
      - Retos
      summary: Crear reto individual o grupal
      description: Si modalidad es grupal, grupo_id es obligatorio. El servidor valida pertenencia, fechas
        y reglas del reto.
      requestBody:
        required: true
        description: Datos de la solicitud
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetoCrear'
      responses:
        '201':
          description: Reto creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reto'
        '401': &ret001
          description: Token inexistente, inválido o vencido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403': &ret002
          description: No tiene permisos para esta operación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422': &ret004
          description: Datos de entrada inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - bearerAuth: []
    get:
      tags:
      - Retos
      summary: Listar retos visibles
      parameters:
      - name: modalidad
        in: query
        description: individual o grupal
        required: false
        schema:
          type: string
      - name: grupo_id
        in: query
        description: Filtrar por grupo
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: Listado de retos accesibles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Reto'
        '401': *ret001
      security:
      - bearerAuth: []
  /retos/{retoId}:
    get:
      tags:
      - Retos
      summary: Consultar detalle de reto
      parameters:
      - name: retoId
        in: path
        description: ''
        required: true
        schema:
          type: integer
          minimum: 1
      responses:
        '200':
          description: Detalle del reto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reto'
        '401': *ret001
        '403': *ret002
        '404': &ret003
          description: Recurso no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - bearerAuth: []
  /retos/{retoId}/cumplimientos:
    post:
      tags:
      - Cumplimientos
      summary: Registrar cumplimiento de reto
      description: Un registro por usuario, reto y fecha. El servidor determina hora y orden de llegada;
        los puntos no se aceptan desde el cliente. La verificación de evidencia y la asignación de puntos
        son reglas del backend.
      parameters:
      - name: retoId
        in: path
        description: ''
        required: true
        schema:
          type: integer
          minimum: 1
      requestBody:
        required: true
        description: Datos de la solicitud
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CumplimientoCrear'
      responses:
        '201':
          description: Cumplimiento recibido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cumplimiento'
        '401': *ret001
        '403': *ret002
        '404': *ret003
        '409':
          description: 'Conflicto: registro duplicado o estado incompatible'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422': *ret004
      security:
      - bearerAuth: []
    get:
      tags:
      - Cumplimientos
      summary: Consultar cumplimientos del reto
      description: Disponible para participantes autorizados.
      parameters:
      - name: retoId
        in: path
        description: ''
        required: true
        schema:
          type: integer
          minimum: 1
      responses:
        '200':
          description: Historial de cumplimientos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Cumplimiento'
        '401': *ret001
        '403': *ret002
        '404': *ret003
      security:
      - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token obtenido al iniciar sesión. El mecanismo exacto se definirá al implementar la
        autenticación.
  schemas:
    RegistroUsuario:
      type: object
      properties:
        nombre:
          type: string
          minLength: 2
          example: Ana López
        correo:
          type: string
          format: email
          example: ana@example.com
        contrasena:
          type: string
          format: password
          minLength: 8
          example: ClaveSegura123
      required:
      - nombre
      - correo
      - contrasena
    Login:
      type: object
      properties:
        correo:
          type: string
          format: email
          example: ana@example.com
        contrasena:
          type: string
          format: password
          example: ClaveSegura123
      required:
      - correo
      - contrasena
    Token:
      type: object
      properties:
        access_token:
          type: string
          example: eyJhbGciOi...
        token_type:
          type: string
          enum:
          - bearer
          example: bearer
      required:
      - access_token
      - token_type
    Usuario:
      type: object
      properties:
        id:
          type: integer
          example: 1
        nombre:
          type: string
          example: Ana López
        correo:
          type: string
          format: email
          example: ana@example.com
        xp:
          type: integer
          minimum: 0
          example: 120
        nivel:
          type: integer
          minimum: 1
          example: 2
      required:
      - id
      - nombre
      - correo
      - xp
      - nivel
    HabitoCrear:
      type: object
      properties:
        nombre: &id003
          type: string
          minLength: 3
          example: Tomar agua
        descripcion: &id004
          type: string
          example: Tomar un vaso de agua al despertar
        frecuencia: &id005
          type: string
          enum:
          - diaria
          - semanal
          example: diaria
      required:
      - nombre
      - frecuencia
    Habito:
      type: object
      properties:
        id:
          type: integer
          example: 10
        usuario_id:
          type: integer
          example: 1
        nombre: *id003
        descripcion: *id004
        frecuencia: *id005
      required:
      - id
      - usuario_id
      - nombre
      - frecuencia
    Estadisticas:
      type: object
      properties:
        usuario_id:
          type: integer
          example: 1
        xp_total:
          type: integer
          example: 120
        nivel:
          type: integer
          example: 2
        retos_completados:
          type: integer
          example: 8
        racha_dias:
          type: integer
          example: 3
        insignias:
          type: array
          items:
            type: string
          example:
          - Primera misión
          - Tres días seguidos
      required:
      - usuario_id
      - xp_total
      - nivel
      - retos_completados
      - racha_dias
      - insignias
    GrupoCrear:
      type: object
      properties:
        nombre: &id010
          type: string
          minLength: 3
          example: Los Madrugadores
        descripcion: &id011
          type: string
          example: Grupo para construir hábitos positivos
        visibilidad: &id012
          type: string
          enum:
          - publico
          - privado
          example: publico
      required:
      - nombre
      - visibilidad
    Grupo:
      type: object
      properties:
        id:
          type: integer
          example: 4
        nombre: *id010
        descripcion: *id011
        visibilidad: *id012
        creador_id:
          type: integer
          example: 1
        miembros:
          type: array
          items:
            type: integer
          example:
          - 1
          - 2
          - 3
          - 4
      required:
      - id
      - nombre
      - visibilidad
      - creador_id
      - miembros
    UnirseGrupo:
      type: object
      properties:
        codigo_invitacion:
          type: string
          description: Opcional para grupos privados; el servidor lo valida.
    RankingEntrada:
      type: object
      properties:
        posicion:
          type: integer
          minimum: 1
          example: 1
        usuario_id:
          type: integer
          example: 1
        nombre:
          type: string
          example: Ana López
        puntos:
          type: integer
          minimum: 0
          example: 25
      required:
      - posicion
      - usuario_id
      - nombre
      - puntos
    Ranking:
      type: object
      properties:
        grupo_id:
          type: integer
          example: 4
        periodo:
          type: string
          enum:
          - semanal
          - mensual
          - general
          example: semanal
        participantes:
          type: array
          items:
            $ref: '#/components/schemas/RankingEntrada'
      required:
      - grupo_id
      - periodo
      - participantes
    Error:
      type: object
      properties:
        detalle:
          type: string
          example: Recurso no encontrado
      required:
      - detalle
    Mensaje:
      type: object
      properties:
        mensaje:
          type: string
          example: Operación exitosa
      required:
      - mensaje
    RetoCrear:
      type: object
      properties:
        titulo: &ret005
          type: string
          minLength: 3
          example: Despertarse temprano
        descripcion: &ret006
          type: string
          example: Registrar el hábito antes de las 5:15 a. m.
        modalidad: &ret007
          type: string
          enum:
          - individual
          - grupal
          example: grupal
        grupo_id: &ret008
          type: integer
          nullable: true
          description: Obligatorio si modalidad es grupal; debe ser un grupo del que el usuario es miembro.
          example: 4
        fecha_inicio: &ret009
          type: string
          format: date
          example: '2026-11-23'
        fecha_fin: &ret010
          type: string
          format: date
          example: '2026-11-29'
        hora_habilitacion: &ret011
          type: string
          description: Hora local HH:MM desde la cual se puede registrar cumplimiento.
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
          example: 05:00
        puntos_base: &ret012
          type: integer
          minimum: 0
          example: 5
      required:
      - titulo
      - modalidad
      - fecha_inicio
      - fecha_fin
      - puntos_base
    Reto:
      type: object
      properties:
        id:
          type: integer
          example: 7
        creador_id:
          type: integer
          example: 1
        titulo: *ret005
        descripcion: *ret006
        modalidad: *ret007
        grupo_id: *ret008
        fecha_inicio: *ret009
        fecha_fin: *ret010
        hora_habilitacion: *ret011
        puntos_base: *ret012
        estado:
          type: string
          enum:
          - programado
          - activo
          - finalizado
          example: activo
      required:
      - id
      - creador_id
      - titulo
      - modalidad
      - fecha_inicio
      - fecha_fin
      - puntos_base
      - estado
    CumplimientoCrear:
      type: object
      properties:
        fecha:
          type: string
          format: date
          example: '2026-11-23'
        evidencia_url:
          type: string
          description: Enlace opcional a evidencia; no implica verificación automática.
          format: uri
          example: https://example.com/evidencias/foto1.jpg
      required:
      - fecha
    Cumplimiento:
      type: object
      properties:
        id:
          type: integer
          example: 30
        reto_id:
          type: integer
          example: 7
        usuario_id:
          type: integer
          example: 1
        fecha:
          type: string
          format: date
          example: '2026-11-23'
        registrado_en:
          type: string
          format: date-time
          example: '2026-11-23T05:02:00-06:00'
        estado:
          type: string
          enum:
          - registrado
          - validado
          - rechazado
          example: registrado
        puntos_otorgados:
          type: integer
          minimum: 0
          example: 0
      required:
      - id
      - reto_id
      - usuario_id
      - fecha
      - registrado_en
      - estado
      - puntos_otorgados